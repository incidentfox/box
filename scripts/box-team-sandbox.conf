# Installed at /etc/box-team-sandbox.conf (root-owned, mode 0600).
# Keep this equal to Box's configured Team workspace root.
WORKSPACE=/home/factory/development/shared

# Optional: give selected isolated Unix guests private snapshots of the owner's
# file-backed Codex and Claude logins. List exact box-* usernames, separated by spaces.
SHARED_AUTH_HOME=
SHARED_AUTH_USERS=
