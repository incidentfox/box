name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y dtach psmisc
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm test
      - run: node scripts/smoke-chat.mjs --fake-codex
